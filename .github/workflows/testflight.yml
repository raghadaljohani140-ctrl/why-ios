name: TestFlight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['why-ios.zip']
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build and send to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WHY_HOST: ${{ vars.WHY_HOST }}
          BUNDLE_PREFIX: ${{ vars.BUNDLE_PREFIX }}
        run: |
          rm -rf work && mkdir work && cd work && unzip -q ../why-ios.zip
          bash why-ios/build.sh
